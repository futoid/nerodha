spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/broker
    username: broker
    password: broker
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always